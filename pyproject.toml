[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-video-notes"
version = "0.1.0"
description = "B站视频转图文笔记并自动入库 ima 知识库的流水线"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["bilibili", "video-notes", "ima", "knowledge-base"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
